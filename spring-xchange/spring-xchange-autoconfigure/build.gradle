plugins {
    id 'java'
}

description = 'xchange autoconfigure package'

dependencies {
    compileOnly rootProject.libs.xchange.core

    // ================================================================
    // Following exchanges provide exchange rates without needing a api secret
    // -----
    compileOnly rootProject.libs.bundles.xchange.exchanges
    // ================================================================

    // ================================================================
    // Following exchanges need a api secret to get an exchange rate
    // hence they are excludes for now
    // -----
    // compileOnly "org.knowm.xchange:xchange-coinmarketcap:${rootProject.ext.xChangeVersion}"
    // compileOnly "org.knowm.xchange:xchange-binance:${rootProject.ext.xChangeVersion}"
    // compileOnly "org.knowm.xchange:xchange-coinbase:${rootProject.ext.xChangeVersion}"
    // ================================================================

    implementation 'javax.ws.rs:javax.ws.rs-api:2.1.1'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation rootProject.libs.xchange.core
    testImplementation rootProject.libs.xchange.kraken
    testImplementation rootProject.libs.xchange.bitstamp
}
