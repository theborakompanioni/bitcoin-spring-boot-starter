apply plugin: 'org.springframework.boot'

description = 'lightning regtest example application package'

dependencies {
    implementation project(':lightning-regtest:lightning-regtest-starter')

    implementation rootProject.libs.springdoc.openapi.ui
    
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // testAndDevelopmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    //integTestImplementation 'org.springframework.boot:spring-boot-docker-compose'
    integTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
