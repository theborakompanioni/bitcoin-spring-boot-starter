plugins {
    id 'java'
}

description = 'xchange jsr354 core package'

dependencies {
    api rootProject.libs.jsr354.api

    // must be exposed because of class AbstractRateProvider
    api rootProject.libs.moneta

    // must be exposed because of e.g. class Exchange
    api rootProject.libs.xchange.core

    testImplementation 'javax.ws.rs:javax.ws.rs-api:2.1.1'

    // import "BTC" as jsr354 CurrencyUnit
    testImplementation project(':bitcoin-jsr354:bitcoin-jsr354-currency')

    // use bitstamp as the exchange in all tests
    testImplementation rootProject.libs.xchange.bitstamp
}
