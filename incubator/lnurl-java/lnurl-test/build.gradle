plugins {
    id 'java'
}

description = 'lnurl test package'

dependencies {
    api project(':incubator:lnurl-java:lnurl-simple')

    api "fr.acinq.bitcoin:bitcoin-kmp-jvm:${rootProject.ext.acinqBitcoinKmpVersion}"
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:${rootProject.ext.acinqSecp256k1KmpVersion}"

    implementation "org.apache.httpcomponents:httpclient:${rootProject.ext.httpComponentsClientVersion}"
    implementation "org.apache.httpcomponents:httpcore:${rootProject.ext.httpComponentsVersion}"
}
