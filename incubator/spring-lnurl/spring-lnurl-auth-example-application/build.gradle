apply plugin: 'org.springframework.boot'
apply plugin: 'net.bytebuddy.byte-buddy-gradle-plugin'

description = 'lnurl-auth example application package'

byteBuddy {
    transformation {
        plugin = org.jmolecules.bytebuddy.JMoleculesPlugin.class
    }
}

dependencies {
    implementation project(':incubator:lnurl-java:lnurl-simple')
    testImplementation project(':incubator:lnurl-java:lnurl-test')

    implementation project(':incubator:spring-lnurl:spring-lnurl-auth-starter')
    implementation "io.github.theborakompanioni:spring-tor-starter:${rootProject.ext.torSpringBootStarterVersion}"

    implementation "fr.acinq.bitcoin:bitcoin-kmp-jvm:${rootProject.ext.acinqBitcoinKmpVersion}"
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:${rootProject.ext.acinqSecp256k1KmpVersion}"

    implementation "com.google.zxing:core:${rootProject.ext.zxingVersion}"
    implementation "com.google.zxing:javase:${rootProject.ext.zxingVersion}"
    implementation "org.apache.httpcomponents:httpclient:${rootProject.ext.httpComponentsClientVersion}"

    implementation 'io.projectreactor:reactor-core'

    implementation 'org.flywaydb:flyway-core'
    implementation "org.xerial:sqlite-jdbc:${rootProject.ext.sqliteVersion}"
    implementation "org.hibernate.orm:hibernate-community-dialects:${rootProject.ext.hibernateCommunityDialectsVersion}"

    implementation 'org.jmolecules:jmolecules-ddd'
    implementation 'org.jmolecules:jmolecules-events'
    implementation 'org.jmolecules.integrations:jmolecules-jpa'
    implementation 'org.jmolecules.integrations:jmolecules-ddd-integration'
    implementation 'org.jmolecules.integrations:jmolecules-spring'
    implementation 'org.jmolecules.integrations:jmolecules-jackson'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.session:spring-session-jdbc'

    implementation 'io.micrometer:micrometer-registry-prometheus'
}
