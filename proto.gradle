apply plugin: 'com.google.protobuf'

sourceSets {
    main {
        proto {
            // In addition to the default 'src/main/proto'
            srcDir file('src/main/java')
        }
        java {
            srcDir layout.buildDirectory.dir('./generated/source/proto/main/java').get().asFile
            srcDir layout.buildDirectory.dir('./generated/source/proto/main/grpc').get().asFile
        }
    }
}
configurations.configureEach {
    resolutionStrategy {
        dependencySubstitution {
            substitute module("com.google.protobuf:protobuf-javalite") using module(rootProject.libs.protobuf.java.toString())
        }
    }
}

dependencies {
    implementation rootProject.libs.bundles.protobuf
}

protobuf {
    protoc { artifact = rootProject.libs.protobuf.protoc.get().toString() }

    plugins {
        grpc { artifact = rootProject.libs.grpc.protoc.gen.get().toString() }
    }

    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}
